<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .preview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Image Upload Test</h1>
    
    <div class="form-group">
        <label for="images">Select Images (max 5, max 5MB each)</label>
        <input type="file" id="images" multiple accept="image/jpeg,image/jpg,image/png,image/webp">
    </div>

    <button onclick="testUpload()">Test Upload</button>

    <div id="preview" class="preview"></div>
    <div id="result" class="result" style="display: none;"></div>

    <script>
        function testUpload() {
            const fileInput = document.getElementById('images');
            const files = fileInput.files;
            
            if (!files || files.length === 0) {
                showResult('Please select at least one image', false);
                return;
            }

            // Preview images
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            Array.from(files).forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                preview.appendChild(img);
            });

            // Create FormData
            const formData = new FormData();
            Array.from(files).forEach(file => {
                formData.append('images', file);
            });

            // Make request
            fetch('http://localhost:5000/api/upload/products', {
                method: 'POST',
                body: formData,
                // Note: No Content-Type header for FormData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showResult(`Upload successful! ${data.data.count} image(s) uploaded. URLs: ${JSON.stringify(data.data.imageUrls, null, 2)}`, true);
                } else {
                    showResult(`Upload failed: ${data.error}`, false);
                }
            })
            .catch(error => {
                showResult(`Network error: ${error.message}`, false);
            });
        }

        function showResult(message, isSuccess) {
            const result = document.getElementById('result');
            result.className = isSuccess ? 'result success' : 'result error';
            result.textContent = message;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
